name: Mainline e2e

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  mainline:
    # Playwright 1.40 installs libasound2. Ubuntu 26.04 only ships libasound2t64.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run the mainline test
        run: yarn test:e2e:mainline
