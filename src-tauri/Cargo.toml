[package]
name = "qwerty-learner"
version = "0.1.0"
description = "为键盘工作者设计的单词与英语肌肉记忆锻炼软件"
authors = ["Qwerty Learner Contributors"]
license = "GPL-3.0"
repository = "https://github.com/RealKai42/qwerty-learner"
default-run = "qwerty-learner"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
