[package]
name = "qwerty-learner"
version = "0.1.0"
description = "为键盘工作者设计的单词与英语肌肉记忆锻炼软件"
authors = ["Qwerty Learner Contributors"]
license = "GPL-3.0"
repository = "https://github.com/RealKai42/qwerty-learner"
default-run = "qwerty-learner"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }

# 发音音频由 Rust 侧拉取并落盘缓存：webview 里的 fetch 会被 CORS 拦下
# （有道不返回 Access-Control-Allow-Origin），Rust 不受同源策略约束。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["fs"] }
base64 = "0.22"
sha2 = "0.10"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
